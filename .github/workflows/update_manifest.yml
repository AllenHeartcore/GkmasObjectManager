name: Update manifest

permissions:
    contents: write # Required to push changes

on:
    # Runs every three hours, on the hour
    schedule:
        - cron: "0 */3 * * *"
    # Allow manual triggering
    workflow_dispatch:

jobs:
    update-manifest:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: "refs/heads/manifest-update"
                  fetch-depth: 1

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12" # 'pyaudioop' removed in 3.13

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Check for manifest updates
              id: run_script
              run: |
                  python update_manifest.py
                  echo "exit_code=$?" >> $GITHUB_OUTPUT

            - name: Warn if up-to-date
              if: steps.run_script.outputs.exit_code == 1
              run: |
                  echo "Warning: Local manifest is up-to-date."
                  exit 0

            - name: Commit manifest changes
              if: steps.run_script.outputs.exit_code == 0
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email ""
                  git add manifests/
                  REV_NUMBER="$(cat manifests/LATEST_REVISION)"
                  git commit -m "Update mobile manifest to revision v$REV_NUMBER"
                  git push origin manifest-update

            - name: Record commit hash
              if: steps.run_script.outputs.exit_code == 0
              run: |
                  REV_NUMBER="$(cat manifests/LATEST_REVISION)"
                  COMMIT_HASH="$(git rev-parse --verify HEAD)"
                  python update_manifest.py --record-commit-hash "$REV_NUMBER|$COMMIT_HASH"

            - name: Commit wayback changes
              if: steps.run_script.outputs.exit_code == 0
              run: |
                  git add wayback_commits.json wayback_objects.json
                  REV_NUMBER="$(cat manifests/LATEST_REVISION)"
                  git commit -m "Rebuild wayback index for manifest revision v$REV_NUMBER"
                  git push origin manifest-update
