root: "gkmas_novelmaster_kit_{revision}"

global-kwargs:
    categorize: false
    convert_image: true

instructions:

    # Identity

    - criterion: "img_chr.*(full|bustup)"
      subdir: "img__misc/_chr"

    - criterion: "img_general_meishi_illust_idol-.*"
      subdir: "img__misc/_chr"

    - criterion: "img_sd.*(?<!thumb-circle.unity3d)$"
      subdir: "img__misc/_sd"

    - criterion: "img_general_meishi_illust_sd.*full"
      subdir: "img__misc/_sd"
      image_resize: "5:7"

    - criterion: "img_(chr|sd).*thumb-(circle|push)"
      subdir: "img__misc/_thumb"

    - criterion: "img_general_sign.*"
      subdir: "img__misc/_general_sign"

    - criterion: "img_general_meishi_illust_sign.*02-full"
      subdir: "img__misc/_general_sign"

    - criterion: "img_general_stamp_(?!non).*"
      subdir: "img__misc/_general_stamp"

    # Core Collection

    - criterion: "img_general_cidol-{char}.*full"
      subdir: "img_general_cidol/{char}"
      image_resize: "9:16"

    - criterion: "img_general_csprt.*full"
      subdir: "img_general_csprt"
      image_resize: "16:9"

    - criterion: "img_general_meishi_base_story-bg.*full"
      subdir: "img_general_meishi_base/story-bg"
      image_resize: "16:9"

    - criterion: "img_general_meishi_base_common-frame.*full"
      subdir: "img_general_meishi_base/common-frame"
      image_resize: "16:9"

    - criterion: "img_general_meishi_base_event.*full"
      subdir: "img_general_meishi_base/event"
      image_resize: "16:9"

    - criterion: "img_general_meishi_base_{char}-birthday.*full"
      subdir: "img_general_meishi_base/birthday"
      image_resize: "16:9"

    - criterion: "img_general_meishi_base_(?!(story-bg|common-frame|event|master-ranking)).*full"
      subdir: "img_general_meishi_base"
      image_resize: "16:9"

    - criterion: "img_general_commu_thumb.*"
      subdir: "img_general__commu"
      image_resize: "16:9"

    - criterion: "img_general_media.*"
      subdir: "img_general__media"
      image_resize: "16:9"

    - criterion: "img_general_live_music.*true-end"
      subdir: "img_general__live_music"
      image_resize: "16:9"

    # Misc (excl. UI)

    - criterion: "img_adv_speaker.*"
      subdir: "img__misc/adv_speaker"

    - criterion: "img_adv_still.*"
      subdir: "img__misc/adv_still"
      image_resize: "9:16"

    - criterion: "img_general_comic_.*"
      subdir: "img__misc/general_comic"
      image_resize: "4:3"

    - criterion: "img_general_comic4.*(?<!thumb.unity3d)$"
      subdir: "img__misc/general_comic4"
      image_resize: "1:3"

    - criterion: "img_general.*event.*header"
      subdir: "img__misc/general_event"
      image_resize: "4:3"

    - criterion: "img_general.*event.*(?<!story)(?<!reward)(?<!rev)-banner.unity3d"
      subdir: "img__misc/general_event/banner"
      image_resize: "3:1"

    - criterion: "img_general.*event.*logo"
      subdir: "img__misc/general_event/logo"
      image_resize: "3:2"

    - criterion: "img_general_meishi_illust_event.*"
      subdir: "img__misc/general_event"
      image_resize: "3:2"

    - criterion: "img_general_meishi_illust_music-logo.*full"
      subdir: "img__misc/music-logo"
      image_resize: "3:2"

    - criterion: "img_login_bg.*"
      subdir: "img__misc/login_bg"
      image_resize: "9:16"

    - criterion: "img_produce_refresh.*"
      subdir: "img__misc/produce_refresh"
      image_resize: "9:16"

    # Many Small Images

    # - criterion: "img_cos_({char}.*body|costume_head_{char}.*head)"
    #   subdir: "img__many/costume/{char}"

    # - criterion: "img_general_item.*"
    #   subdir: "img__many/item"

    # - criterion: "img_general_skillcard.*"
    #   subdir: "img__many/skillcard"

    # - criterion: "img_general_pitem.*"
    #   subdir: "img__many/pitem"

    # - criterion: "img_general_pdrink.*"
    #   subdir: "img__many/pdrink"

post-processing: "novelmaster_kit_pp.py"
